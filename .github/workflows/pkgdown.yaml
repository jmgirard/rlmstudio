# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  # Builds the site on every run, with the read-only permissions above.
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders root .md files as site pages (pkgdown:::package_mds()
      # lists which) and does not read .Rbuildignore, so CLAUDE.md would
      # otherwise become one.
      - name: Remove CLAUDE.md before the build
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # build_site_github_pages() writes docs/.nojekyll, and upload-artifact
      # leaves out hidden files by default.
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  # Deploys only from a published release or a run on the default branch.
  # Every other run skips this job, for example a pull request (ref
  # refs/pull/<n>/merge) or a manual run on another branch. This is the only
  # job with write permission or a concurrency group.
  deploy:
    needs: build
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-deploy
    permissions:
      contents: write
    steps:
      # The deploy action runs git in a checkout. The checkout comes first,
      # because on a folder with no git repository it deletes the contents.
      - uses: actions/checkout@v6

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: docs

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
