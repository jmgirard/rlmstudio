# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" routes macOS through Posit Package Manager too; see the
          # macOS step below for why, and for the two settings it still needs.
          # The default is "true", which routes Linux and Windows but not macOS.
          use-public-rspm: always

      # Since 2026-09-20 CRAN serves its macOS R 4.6 binaries as zstd archives
      # under the .tgz name, and the pak that setup-r-dependencies installs
      # rejects them as "unknown archive type" (r-lib/pkgdepends#485). Package
      # Manager still serves gzip builds of the same versions. use-public-rspm:
      # always above puts it first, but setup-r keeps CRAN as a second repo, and
      # pak still resolved two packages from it on the first try. So
      # PKG_CRAN_MIRROR makes pak read the CRAN entry as Package Manager too.
      #
      # The hosts lines are a backstop. pkgcache attaches mac.cran.dev as a
      # second download URL to every macOS binary from a repo it types "cran",
      # and keeps whichever download finishes first, and that host serves CRAN's
      # zstd file directly. When PKG_CRAN_MIRROR holds the exact URL setup-r
      # gave Package Manager, pkgcache drops the duplicate CRAN row and no
      # "cran"-typed repo is left for the host to attach to. Should the two URLs
      # ever differ, that row returns and the hosts lines are what stop it. Both
      # families are blocked, because the host publishes an AAAA record as well.
      #
      # Two consequences to know. On macOS pak loses the CRAN source-Archive
      # fallback, which is gated on the same "cran" type, so a dependency
      # pinned to a version the Package Manager snapshot no longer carries
      # fails there while Linux and Windows still resolve it. And Package
      # Manager becomes the only source for the macOS job, so an outage there
      # turns it red with nothing to fall back on.
      #
      # Drop this step, and set use-public-rspm to true, once a released pak
      # extracts zstd.
      - name: Use Package Manager binaries on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          P3M='https://packagemanager.posit.co/cran/latest'
          echo "PKG_CRAN_MIRROR=${P3M}" >> "$GITHUB_ENV"
          printf '%s\n%s\n' '127.0.0.1 mac.cran.dev' '::1 mac.cran.dev' \
            | sudo tee -a /etc/hosts > /dev/null
          echo "PKG_CRAN_MIRROR set to ${P3M}; mac.cran.dev blocked"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
