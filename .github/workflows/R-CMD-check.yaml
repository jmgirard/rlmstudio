# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'cairn/**'
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" routes macOS through Posit Package Manager too; see the
          # macOS step below for why, and for the two settings it still needs.
          use-public-rspm: always

      # Since 2026-09-20 CRAN serves its macOS R 4.6 binaries as zstd archives
      # under the .tgz name, and the pak that setup-r-dependencies installs
      # rejects them as "unknown archive type" (r-lib/pkgdepends#485). Package
      # Manager still serves gzip builds of the same versions. use-public-rspm:
      # always above puts it first, but setup-r keeps CRAN as a second repo, and
      # pak still resolved two packages from it on the first try. So:
      # PKG_CRAN_MIRROR makes pak read the CRAN entry as Package Manager too,
      # and mac.cran.dev is blocked, because pkgcache attaches that host as a
      # second download URL to every macOS CRAN binary and keeps whichever
      # download finishes first (it serves CRAN's zstd file directly). Drop this
      # step, and set use-public-rspm back to true, once a released pak extracts
      # zstd.
      - name: Use Package Manager binaries on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          P3M='https://packagemanager.posit.co/cran/latest'
          echo "PKG_CRAN_MIRROR=${P3M}" >> "$GITHUB_ENV"
          echo '127.0.0.1 mac.cran.dev' | sudo tee -a /etc/hosts > /dev/null
          echo "PKG_CRAN_MIRROR set to ${P3M}; mac.cran.dev blocked"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
